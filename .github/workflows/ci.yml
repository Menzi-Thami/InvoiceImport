name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Microsoft's current install script, not actions/setup-dotnet: the copy bundled in setup-dotnet@v6 downloads from
      # a storage account that began refusing public access on 25 Oct 2026 (409 PublicAccessNotPermitted). The current
      # script downloads from builds.dotnet.microsoft.com, but only for an exact version: asked for a channel, it still
      # tries an aka.ms link that leads to the blocked account. So look up the latest 10.0 SDK first (there's no
      # global.json, so this is what dotnet-version: 10.0.x picked).
      - name: Install .NET
        run: |
          curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          version=$(curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json | jq -r '."latest-sdk"')
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$version" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version

      - name: Restore
        run: dotnet restore "InvoiceImport.sln"

      - name: Build
        run: dotnet build "InvoiceImport.sln" -c Release --no-restore

      - name: Test
        run: dotnet test "InvoiceImport.sln" -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
