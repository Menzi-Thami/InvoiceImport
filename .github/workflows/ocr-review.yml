name: AI code review

# Reviews human pull requests against the shared .NET rules using GitHub Models,
# which is free and authenticates with the workflow's own GITHUB_TOKEN: no API key
# to create, store or rotate. Gated on the OCR_ENABLED repository variable:
#
#   gh variable set OCR_ENABLED   --body "true" --repo <repo>
#   gh variable set OCR_LLM_URL   --body "https://models.github.ai/inference" --repo <repo>
#   gh variable set OCR_LLM_MODEL --body "openai/gpt-4.1-mini" --repo <repo>

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Bot pull requests are skipped: without this every Dependabot bump spends
    # quota for nothing.
    if: >-
      vars.OCR_ENABLED == 'true'
      && github.event.pull_request.user.type != 'Bot'
    steps:
      # The review action checks the repository out itself and cleans the workspace,
      # so rules fetched into the workspace vanish before it reads them. Keep them in
      # RUNNER_TEMP instead.
      - name: Fetch shared .NET review rules
        run: git clone --depth 1 https://github.com/Menzi-Thami/dotnet-review-rules.git "$RUNNER_TEMP/review-rules"

      - uses: alibaba/open-code-review@main
        with:
          llm_url: ${{ vars.OCR_LLM_URL }}
          llm_auth_token: ${{ github.token }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          llm_protocol: 'openai'
          stream_progress: 'true'
          rule: ${{ runner.temp }}/review-rules/.opencodereview/rule.json

          # GitHub Models speaks the OpenAI-compatible protocol, so the action's
          # default extra_body (an Anthropic-shaped "thinking" key) does not
          # apply. Sent empty to avoid a 400 on an unknown field.
          llm_extra_body: '{}'

          # Free-tier tuning. GitHub Models rate-limits requests per minute and
          # per day, and a review fans out one request per file, so concurrency
          # is held down to stay under it.
          review_concurrency: '2'
          effort: 'low'
          max_tokens_budget: '1000000'

          sticky_summary: 'true'
          incremental: 'true'
          route_severity_below: 'low'
